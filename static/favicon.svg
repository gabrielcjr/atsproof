<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Rounded Squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle Inner Border -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5"/>

  <!-- Document Body with Shadow -->
  <g filter="url(#shadow)">
    <!-- Document Base -->
    <path d="M18 14 C18 12.895 18.895 12 20 12 L36 12 L46 22 L46 50 C46 51.105 45.105 52 44 52 L20 52 C18.895 52 18 51.105 18 50 Z" fill="#ffffff"/>
    <!-- Folded Corner -->
    <path d="M36 12 L36 22 L46 22 Z" fill="#e0e7ff"/>
    
    <!-- Document Lines -->
    <line x1="24" y1="28" x2="34" y2="28" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="24" y1="34" x2="40" y2="34" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <line x1="24" y1="40" x2="36" y2="40" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Green Verification Spark / Check Badge -->
  <circle cx="45" cy="45" r="11" fill="url(#badgeGrad)" stroke="#ffffff" stroke-width="2"/>
  <path d="M41.5 45 L44 47.5 L49 42.5" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
