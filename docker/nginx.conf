events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Hide Nginx version
    server_tokens off;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Buffer & Timeout hardening (Slowloris & Buffer Overflow protection)
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;
    client_body_timeout 10s;
    client_header_timeout 10s;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Edge Rate & Connection Limiting
    limit_req_zone $binary_remote_addr zone=req_limit:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # HTTP Server: Redirect all traffic to HTTPS (allow ACME challenge if needed)
    server {
        listen 80;
        server_name atsproof.website www.atsproof.website _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS Server: SSL/TLS Termination + Security Filters + Proxy to FastAPI
    server {
        listen 443 ssl default_server;
        server_name atsproof.website www.atsproof.website _;

        ssl_certificate /etc/letsencrypt/live/atsproof.website/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/atsproof.website/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Client body limit (Allows up to 1MB; app limits to 120KB PDF)
        client_max_body_size 1M;

        # Security Headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Connection Limit
        limit_conn conn_limit 20;

        # Only allow safe HTTP methods
        if ($request_method !~ ^(GET|POST|HEAD)$ ) {
            return 405;
        }

        # Block known vulnerability scanners and automated attack tools
        if ($http_user_agent ~* (sqlmap|nikto|wpscan|masscan|zgrab|nmap|acunetix|gobuster|dirbuster|censys|shodan|morfeus) ) {
            return 444;
        }

        # 1. Block access to hidden files / directories (e.g. /.env, /.git, /.aws, /.docker), EXCEPT .well-known
        location ~ /\.(?!well-known) {
            access_log off;
            log_not_found off;
            return 444;
        }

        # 2. Block direct probing for sensitive file extensions in any directory (e.g. /server/.env, /app/.env.live, config.bak, dump.sql)
        location ~* (\.env|\.git|\.yml|\.yaml|\.ini|\.conf|\.bak|\.backup|\.old|\.sql|\.tar|\.gz|\.zip|\.bz2|\.7z|\.log|\.swp|\.temp|\.tmp)$ {
            access_log off;
            log_not_found off;
            return 444;
        }

        # 3. Block common exploit targets, CMS paths, CGI, and backend probes
        location ~* /(wp-admin|wp-content|wp-includes|wp-login|xmlrpc\.php|phpmyadmin|pma|cgi-bin|actuator|telescope|_profiler|autodiscover|server-status|solr|boaform) {
            access_log off;
            log_not_found off;
            return 444;
        }

        # 4. Main proxy location
        location / {
            limit_req zone=req_limit burst=20 nodelay;

            # Proxy directly to internal Uvicorn on localhost
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;

            # Forward real client headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Connection "";

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
