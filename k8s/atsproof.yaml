apiVersion: apps/v1
kind: Deployment
metadata:
  name: atsproof-web
  namespace: atsproof
  labels:
    app: atsproof
spec:
  replicas: 1
  selector:
    matchLabels:
      app: atsproof
  template:
    metadata:
      labels:
        app: atsproof
    spec:
      containers:
        - name: web
          image: gacarneirojrx/atsproof:latest
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: atsproof-secret
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: atsproof-service
  namespace: atsproof
spec:
  type: NodePort
  selector:
    app: atsproof
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 30081
