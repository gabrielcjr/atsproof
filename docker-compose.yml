services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ats_matcher
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
