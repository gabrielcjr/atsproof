<div class="rounded-2xl bg-gradient-to-b from-rose-950/40 via-slate-900/90 to-slate-900/90 border border-rose-500/30 p-6 sm:p-8 backdrop-blur-md shadow-2xl animate-fade-in text-left">
    <div class="flex items-start space-x-4">
        <!-- Alert Icon -->
        <div class="w-11 h-11 rounded-xl bg-rose-500/15 text-rose-400 flex items-center justify-center border border-rose-500/30 flex-shrink-0 shadow-inner">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
            </svg>
        </div>

        <div class="flex-1 min-w-0">
            <!-- Header & Badge -->
            <div class="flex items-center justify-between gap-2 flex-wrap">
                <h3 class="text-lg font-bold text-white tracking-tight">
                    {{ error_title | default('Unable to Complete Analysis') }}
                </h3>
                <span class="text-[11px] font-medium px-2.5 py-0.5 rounded-full bg-rose-500/20 text-rose-300 border border-rose-500/30">
                    {% if error_type == 'server' %}High Demand{% else %}Input Notice{% endif %}
                </span>
            </div>

            <!-- Error Message Description -->
            <p class="text-sm text-slate-300 mt-2 leading-relaxed">
                {{ error_message }}
            </p>

            {% if suggestion %}
            <p class="text-xs text-rose-300/90 mt-2 font-medium">
                💡 {{ suggestion }}
            </p>
            {% endif %}

            <!-- Guidance & Action Footer -->
            <div class="mt-5 pt-4 border-t border-slate-800/80 flex flex-col sm:flex-row sm:items-center justify-between gap-4 text-xs text-slate-400">
                <div class="flex items-center space-x-2">
                    <svg class="w-4 h-4 text-emerald-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
                    </svg>
                    <span>PDF must be text-based (max 120KB, max 3 pages).</span>
                </div>

                <button 
                    type="button"
                    onclick="document.getElementById('submit-btn')?.click() || window.scrollTo({top: 0, behavior: 'smooth'})"
                    class="inline-flex items-center justify-center space-x-1.5 px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 hover:text-white border border-slate-700 transition font-medium active:scale-95 shadow-sm"
                >
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                    </svg>
                    <span>Try Again</span>
                </button>
            </div>
        </div>
    </div>
</div>
